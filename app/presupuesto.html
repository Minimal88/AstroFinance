<title>Presupuesto 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="css">
/* Layout: one phone-width column. Sticky header (title, $/₡ switch, exchange rate),
   a hero with what is left each month against the 10–20% goal, the month split as a
   stacked bar, the two paydays side by side, then income and each spending group. */
:root {
  --bg: #eef0f6;
  --surface: #ffffff;
  --surface-2: #f4f5fa;
  --fg: #111526;
  --muted: #5c6378;
  --line: #dadeea;
  --accent: #3d43b8;
  --accent-soft: #e6e7fa;
  --on-accent: #ffffff;
  --ok: #17824a;
  --ok-soft: #dff3e8;
  --warn: #b5470f;
  --warn-soft: #fbe9df;
  --danger: #c2262e;
  --danger-soft: #fbe3e4;
  --scrim: rgba(10, 14, 22, 0.45);
  --band: rgba(23, 130, 74, 0.16);
  /* One fixed color per spending group (validated categorical order). */
  --g-casa: #2a78d6;
  --g-transporte: #eb6834;
  --g-salud: #1baf7a;
  --g-personal: #eda100;
  --g-otros: #e87ba4;
  --g-ahorro: #008300;
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1017; --surface: #161a26; --surface-2: #1c2130; --fg: #e7eaf4; --muted: #8d95aa;
    --line: #282e40; --accent: #9aa0ff; --accent-soft: #23264d; --on-accent: #0b0d24;
    --ok: #4fc68c; --ok-soft: #133524; --warn: #ff9a66; --warn-soft: #3a2116; --danger: #ff6b72; --danger-soft: #3a1619;
    --scrim: rgba(0, 0, 0, 0.6); --band: rgba(79, 198, 140, 0.18);
    --g-casa: #3987e5; --g-transporte: #d95926; --g-salud: #199e70; --g-personal: #c98500; --g-otros: #d55181; --g-ahorro: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1017; --surface: #161a26; --surface-2: #1c2130; --fg: #e7eaf4; --muted: #8d95aa;
  --line: #282e40; --accent: #9aa0ff; --accent-soft: #23264d; --on-accent: #0b0d24;
  --ok: #4fc68c; --ok-soft: #133524; --warn: #ff9a66; --warn-soft: #3a2116; --danger: #ff6b72; --danger-soft: #3a1619;
  --scrim: rgba(0, 0, 0, 0.6); --band: rgba(79, 198, 140, 0.18);
  --g-casa: #3987e5; --g-transporte: #d95926; --g-salud: #199e70; --g-personal: #c98500; --g-otros: #d55181; --g-ahorro: #008300;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.app { max-width: 720px; margin: 0 auto; padding-bottom: 40px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 14px 12px; }
.badge { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
.who .sub { font-size: 0.78rem; color: var(--muted); }
.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; color: var(--muted); font-family: var(--font-num); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.rate { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--muted); font-size: 0.78rem; text-decoration: underline dotted; text-underline-offset: 3px; }
.rate[disabled] { text-decoration: none; cursor: default; }

/* Hero: what is left each month */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
.hero-figure { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero-figure .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 9vw, 3.1rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.hero-figure .big.neg { color: var(--danger); }
.hero-figure .pct { font-family: var(--font-num); font-weight: 600; font-size: 1.05rem; color: var(--muted); }
.status { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.bad { background: var(--danger-soft); color: var(--danger); }
.gauge { position: relative; height: 34px; margin-top: 4px; }
.gauge .track { position: absolute; left: 0; right: 0; top: 8px; height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.gauge .band { position: absolute; top: 0; bottom: 0; background: var(--band); border-left: 1px dashed var(--ok); border-right: 1px dashed var(--ok); }
.gauge .marker { position: absolute; top: 2px; width: 4px; height: 22px; margin-left: -2px; border-radius: 4px; background: var(--fg); box-shadow: 0 0 0 2px var(--surface); }
.gauge .tick { position: absolute; top: 22px; font-size: 0.68rem; color: var(--muted); font-family: var(--font-num); transform: translateX(-50%); }
.gauge .tick.end { transform: translateX(-100%); }
.gauge .tick.start { transform: none; }
.hero .foot-line { font-size: 0.82rem; color: var(--muted); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card-head .meta { font-size: 0.8rem; color: var(--muted); }

/* Month split: stacked bar + legend that doubles as the table view */
.stack { position: relative; display: flex; gap: 2px; height: 26px; border-radius: 8px; overflow: hidden; }
.stack .s { display: block; height: 100%; min-width: 3px; border: 0; padding: 0; }
.stack .s.free { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--line) 6px 8px); }
.stack .s.over { background: repeating-linear-gradient(135deg, var(--danger-soft) 0 6px, var(--danger) 6px 8px); }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; margin: 0; padding: 0; list-style: none; }
@media (max-width: 520px) { .legend { grid-template-columns: minmax(0, 1fr); } }
.legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 0.86rem; }
.legend .sw { width: 12px; height: 12px; border-radius: 4px; }
.legend .sw.free { background: repeating-linear-gradient(135deg, var(--surface-2) 0 3px, var(--muted) 3px 4px); border: 1px solid var(--line); }
.legend .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--muted); }
.legend .v b { color: var(--fg); font-weight: 600; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 0.8rem; font-weight: 600; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }

/* Paydays */
.paydays { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 360px) { .paydays { grid-template-columns: minmax(0, 1fr); } }
.payday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.payday .when { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.payday .left { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.payday .left.neg { color: var(--danger); }
.payday .bar { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.payday .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.payday .bar > i.full { background: var(--danger); }
.payday .rows { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 0.8rem; color: var(--muted); }
.payday .rows span:nth-child(even) { font-family: var(--font-num); text-align: right; color: var(--fg); }
.payday.tight { border-color: var(--warn); }
.payday .flag { align-self: flex-start; font-size: 0.72rem; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; }

/* Line lists */
.lines { display: flex; flex-direction: column; margin: 0 -14px -14px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
button.line:hover { background: var(--surface-2); }
button.line:active { background: var(--surface-2); }
.line .name { font-weight: 700; font-size: 0.93rem; overflow-wrap: anywhere; }
.line .amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; font-size: 0.95rem; }
.line .amt.minus { color: var(--danger); }
.line .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); }
.line .meta .orig { font-family: var(--font-num); }
.line .share { font-family: var(--font-num); font-size: 0.78rem; color: var(--muted); text-align: right; }
.line .note { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.line.total { background: var(--surface-2); }
.line.total .name { font-family: var(--font-display); }
.q { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.q.m { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.q.end { background: var(--warn-soft); color: var(--warn); }
.group-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.group-head h2 { display: flex; align-items: center; }
.group-head .tot { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.group-head .tot small { display: block; font-size: 0.74rem; color: var(--muted); font-weight: 500; }
details.ended { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; }
details.ended summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 0.9rem; }
details.ended .lines { margin: 10px -14px -12px; }
details.ended .line .name { color: var(--muted); text-decoration: line-through; }

.add { border: 1px dashed var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 12px; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; }

.empty, .notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px 18px; text-align: center; color: var(--muted); }
.notice { border-style: solid; text-align: left; color: var(--fg); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.notice p { margin: 0; color: var(--muted); }
.skeleton { height: 120px; border-radius: 18px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border: 1px solid var(--line); }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); color: var(--fg); border-color: var(--line); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger.sure { background: var(--danger); color: var(--surface); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.foot { font-size: 0.76rem; color: var(--muted); text-align: center; margin: 4px 0 0; }

/* Edit sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 600px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; }
.sheet .hint { color: var(--muted); font-size: 0.82rem; margin: -6px 0 0; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.fld input, .fld select, .fld textarea { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--surface-2); min-width: 0; width: 100%; }
.fld textarea { min-height: 60px; resize: vertical; }
.fld-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick label { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pick span { display: inline-block; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 0.86rem; font-weight: 600; }
.pick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.preview { font-size: 0.82rem; color: var(--muted); }
.preview b { color: var(--fg); font-family: var(--font-num); }
.sheet .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.sheet .actions .spacer { flex: 1; }
.sheet .error { color: var(--danger); font-size: 0.85rem; margin: 0; }
</style>
<div id="app" class="app"></div>
<div id="modal"></div>
<div id="tip" class="tip" hidden></div>
<script id="code">
(() => {
  "use strict";

  const SERVER = "Google Sheets";
  const SHEET_ID = "1jLcS4xf7jNM6OE2nGU5aHX3JThDyL4ud5gVqhvZ13ss";
  const TAB = "Presupuesto";
  const RANGE = TAB + "!A:K";
  const COLS = ["Tipo", "Concepto", "Monto", "Moneda", "Quincena", "Grupo", "Hasta", "Notas"];
  const RATE_HEADER = "TipoCambio", GOAL_HEADER = "MetaSaldo";
  // Spending groups in a fixed order, each with its own color. Anything else falls in "Otros".
  const GROUPS = [["Casa", "--g-casa"], ["Transporte", "--g-transporte"], ["Salud", "--g-salud"], ["Personal", "--g-personal"], ["Otros", "--g-otros"], ["Ahorro", "--g-ahorro"]];
  const TYPES = [["Gasto", "Gasto"], ["Ahorro", "Ahorro"], ["Ingreso", "Ingreso"], ["Deducción", "Deducción"]];
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const CONSENT = ["approval_required", "not_in_manifest", "consent_required"];

  const saved = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  const state = {
    cur: saved("presupuesto:cur", "USD") === "CRC" ? "CRC" : "USD",
    data: null, error: null, mcp: undefined,
    editing: null, saving: false, saveError: "", confirmDelete: false,
    rateEditing: false,
  };

  // ---------- Helpers ----------
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function parseAmount(raw) {
    if (typeof raw === "number") return raw;
    const t = String(raw ?? "").replace(/[^\d.,-]/g, "").replace(/,/g, "");
    const n = parseFloat(t);
    return isNaN(n) ? 0 : n;
  }
  function normCur(raw) {
    const t = String(raw ?? "").trim().toUpperCase();
    if (t === "%" ) return "%";
    if (t === "CRC" || t === "₡" || t.startsWith("COL")) return "CRC";
    return "USD";
  }
  function normType(raw) {
    const t = String(raw ?? "").trim().toLowerCase();
    if (t.startsWith("ingres")) return "Ingreso";
    if (t.startsWith("deduc")) return "Deducción";
    if (t.startsWith("ahorr")) return "Ahorro";
    if (t.startsWith("gast")) return "Gasto";
    return "";
  }
  // "Hasta" is a month: MM/YYYY (also reads yyyy-mm, d/m/yyyy and a Sheets date serial). Returns "yyyy-mm" or "".
  function parseMonth(raw) {
    const t = String(raw ?? "").trim();
    if (/^\d{5}(\.\d+)?$/.test(t)) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(+t) * 86400000);
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
    }
    let m = t.match(/^(\d{4})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, "0")}`;
    m = t.match(/^(?:\d{1,2}[\/-])?(\d{1,2})[\/-](\d{4})$/);
    if (m) return `${m[2]}-${m[1].padStart(2, "0")}`;
    return "";
  }
  const monthLabel = (ym) => { if (!ym) return ""; const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
  const sheetMonth = (ym) => { if (!ym) return ""; const [y, m] = ym.split("-"); return `${m}/${y}`; };
  function thisMonth() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
  function fmtStamp(ms) {
    const d = new Date(ms);
    if (isNaN(d)) return "";
    return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function groupOf(raw, type) {
    if (type === "Ahorro") return "Ahorro";
    const t = String(raw ?? "").trim().toLowerCase();
    const g = GROUPS.find(([name]) => name.toLowerCase() === t);
    return g && g[0] !== "Ahorro" ? g[0] : "Otros";
  }
  const groupColor = (g) => `var(${(GROUPS.find(([n]) => n === g) || GROUPS[4])[1]})`;

  // Every amount is kept in dollars inside the page; colones lines are converted with the sheet's rate.
  function toUsd(amount, cur, rate) { return cur === "CRC" ? (rate ? amount / rate : 0) : amount; }
  function money(usd, cur = state.cur) {
    const rate = state.data ? state.data.rate : 0;
    const neg = usd < 0;
    const v = Math.abs(cur === "CRC" ? usd * rate : usd);
    return (neg ? "−" : "") + (cur === "CRC" ? "₡" : "$") + Math.round(v).toLocaleString("en-US");
  }
  function native(l) {
    if (l.cur === "%") return `${l.amount}%`;
    return (l.cur === "CRC" ? "₡" : "$") + (Math.round(l.amount * 100) / 100).toLocaleString("en-US");
  }
  const pct = (part, whole) => (whole ? (part / whole) * 100 : 0);
  const fmtPct = (n) => `${n.toFixed(n >= 10 || n === 0 ? 0 : 1)}%`;

  // ---------- Sheet → budget ----------
  function valuesOf(result) {
    const p = result && (result.payload ?? result);
    if (p && Array.isArray(p.values)) return p.values;
    if (p && typeof p === "object" && !Array.isArray(p)) return [];
    throw new Error("Respuesta inesperada de Google Sheets.");
  }
  function build(values) {
    if (!values.length) throw new Error(`La pestaña ${TAB} está vacía.`);
    const header = values[0].map((h) => String(h).trim());
    const idx = Object.fromEntries(COLS.map((c) => [c, header.indexOf(c)]));
    if (Object.values(idx).some((i) => i < 0)) throw new Error(`La pestaña ${TAB} no tiene las columnas esperadas.`);
    const cell = (name) => { const i = header.indexOf(name); return i < 0 || !values[1] ? "" : values[1][i]; };
    const rate = parseAmount(cell(RATE_HEADER)) || 500;
    const goalM = String(cell(GOAL_HEADER) || "10-20").match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);
    const goal = goalM ? [+goalM[1], +goalM[2]] : [10, 20];
    const now = thisMonth();
    const lines = [];
    values.slice(1).forEach((r, i) => {
      const type = normType(r[idx.Tipo]);
      const name = String(r[idx.Concepto] ?? "").trim();
      if (!type || !name) return;
      const cur = normCur(r[idx.Moneda]);
      const amount = parseAmount(r[idx.Monto]);
      const qRaw = String(r[idx.Quincena] ?? "").trim();
      // 1 or 2: that payday only. "Ambas": the amount comes or goes every payday (twice a month).
      // Blank: a monthly amount, split between both paydays.
      const q = qRaw.startsWith("1") ? 1 : qRaw.startsWith("2") ? 2 : /^(amb|cada|q)/i.test(qRaw) ? 3 : 0;
      const until = parseMonth(r[idx.Hasta]);
      lines.push({
        row: i + 2, type, name, amount, cur: type === "Deducción" ? cur : cur === "%" ? "USD" : cur, q,
        groupRaw: String(r[idx.Grupo] ?? "").trim(), group: groupOf(r[idx.Grupo], type),
        until, ended: !!until && until < now,
        notes: String(r[idx.Notas] ?? "").trim(),
      });
    });
    return { lines, rate, goal, at: Date.now() };
  }

  // What a line adds up to in a month, in dollars.
  const monthly = (l, rate) => toUsd(l.amount, l.cur, rate) * (l.q === 3 ? 2 : 1);
  // The part of a line's monthly amount that falls on payday q.
  const shareOn = (l, q) => (l.q === q ? l.usd : l.q === 0 || l.q === 3 ? l.usd / 2 : 0);
  const sumOn = (list, q) => list.reduce((s, l) => s + shareOn(l, q), 0);
  function compute(d) {
    const active = d.lines.filter((l) => !l.ended);
    const incomes = active.filter((l) => l.type === "Ingreso").map((l) => ({ ...l, usd: monthly(l, d.rate) }));
    const gross = incomes.reduce((s, l) => s + l.usd, 0);
    const deductions = active.filter((l) => l.type === "Deducción").map((l) => ({ ...l, usd: l.cur === "%" ? (gross * l.amount) / 100 : monthly(l, d.rate) }));
    const net = gross - deductions.reduce((s, l) => s + l.usd, 0);
    const spend = active.filter((l) => l.type === "Gasto" || l.type === "Ahorro").map((l) => ({ ...l, usd: monthly(l, d.rate) }));
    const total = spend.reduce((s, l) => s + l.usd, 0);
    const groups = GROUPS.map(([g]) => {
      const items = spend.filter((l) => l.group === g);
      return { g, items, usd: items.reduce((s, l) => s + l.usd, 0) };
    }).filter((x) => x.items.length);
    const qs = [1, 2].map((q) => {
      const income = sumOn(incomes, q) - sumOn(deductions, q);
      const out = sumOn(spend, q);
      return { q, income, out, left: income - out };
    });
    const ended = d.lines.filter((l) => l.ended);
    return { gross, deductions, net, spend, total, groups, qs, left: net - total, ended, incomes };
  }

  // ---------- Rendering ----------
  function render() {
    const d = state.data;
    const owner = !!d;
    let html = `
      <header class="top"><div class="gutter top-row">
        <div class="badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
        </div>
        <div class="who"><h1>Presupuesto 2026</h1>
          <div class="sub">${d ? `<button class="rate" type="button" data-action="rate" ${owner ? "" : "disabled"} aria-label="Cambiar tipo de cambio">₡${esc(d.rate.toLocaleString("en-US"))} por dólar</button> · en vivo · ${esc(fmtStamp(d.at))}` : "Mensual, en dólares y colones"}</div>
        </div>
        <div class="seg" role="group" aria-label="Moneda">
          <button type="button" data-cur="USD" aria-pressed="${state.cur === "USD"}" aria-label="Dólares">$</button>
          <button type="button" data-cur="CRC" aria-pressed="${state.cur === "CRC"}" aria-label="Colones">₡</button>
        </div>
      </div></header>
      <main class="gutter">`;
    if (!d) {
      if (state.error && CONSENT.includes(state.error.code)) {
        html += `<div class="notice"><p>Esta página lee la pestaña ${TAB} de tu hoja AstroFinance con tu conector de Google Sheets.</p>
          <button class="btn" type="button" data-action="connect">Conectar con la hoja</button></div>`;
      } else if (state.error) {
        html += `<div class="notice"><p>${esc(state.error.message || "No se pudo leer la hoja.")}</p>
          <button class="btn secondary" type="button" data-action="connect">Intentar de nuevo</button></div>`;
      } else if (state.mcp === null) {
        html += `<div class="empty">Esta vista no tiene acceso a Google Sheets. Ábrela desde tu cuenta de claude.ai.</div>`;
      } else {
        html += `<div class="skeleton"></div><div class="skeleton" style="height:80px"></div>`;
      }
      html += `</main>`;
      $("#app").innerHTML = html;
      return;
    }
    const c = compute(d);
    html += hero(c, d) + split(c) + paydays(c) + income(c) + c.groups.map((g) => groupCard(g, c)).join("") + ended(c);
    html += `<button class="add" type="button" data-action="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Agregar línea</button>`;
    html += `<p class="foot">Toca cualquier línea para cambiarla. Todo se guarda en la pestaña ${TAB} de tu hoja.</p></main>`;
    $("#app").innerHTML = html;
    if (!state.editing && !state.rateEditing) $("#modal").innerHTML = "";
  }

  function hero(c, d) {
    const p = pct(c.left, c.net);
    const [lo, hi] = d.goal;
    const max = Math.max(30, Math.ceil((p + 5) / 10) * 10);
    const pos = (v) => Math.min(100, Math.max(0, (v / max) * 100));
    let cls, label;
    if (c.left < 0) { cls = "bad"; label = `Te pasas por ${money(-c.left)} al mes`; }
    else if (p < lo) { cls = "warn"; label = `Debajo de la meta del ${lo}–${hi}%`; }
    else if (p > hi) { cls = "ok"; label = `Arriba de la meta: podrías ahorrar más`; }
    else { cls = "ok"; label = `Dentro de la meta del ${lo}–${hi}%`; }
    const icon = cls === "ok"
      ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>`
      : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>`;
    const saving = c.groups.find((g) => g.g === "Ahorro");
    return `<section class="hero" aria-label="Saldo libre">
      <span class="eyebrow">Te queda libre cada mes</span>
      <div class="hero-figure"><span class="big ${c.left < 0 ? "neg" : ""}">${esc(money(c.left))}</span><span class="pct">${esc(fmtPct(p))} del ingreso neto</span></div>
      <span class="status ${cls}">${icon}${esc(label)}</span>
      <div class="gauge" role="img" aria-label="Saldo libre ${esc(fmtPct(p))}; meta ${lo} a ${hi}%">
        <div class="track"><div class="band" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></div></div>
        <div class="marker" style="left:${pos(Math.max(0, p))}%"></div>
        <span class="tick start" style="left:0">0%</span>
        <span class="tick" style="left:${pos(lo)}%">${lo}%</span>
        <span class="tick" style="left:${pos(hi)}%">${hi}%</span>
        <span class="tick end" style="left:100%">${max}%</span>
      </div>
      <span class="foot-line">Ingreso neto <b class="num">${esc(money(c.net))}</b> · gastos y ahorro <b class="num">${esc(money(c.total))}</b>${saving ? ` · ahorras <b class="num">${esc(fmtPct(pct(saving.usd, c.net)))}</b>` : ""}</span>
    </section>`;
  }

  function split(c) {
    const base = Math.max(c.net, c.total);
    const segs = c.groups.map((g) => ({ label: g.g, usd: g.usd, color: groupColor(g.g) }));
    if (c.left > 0) segs.push({ label: "Libre", usd: c.left, free: true });
    const bar = segs.map((s) => `<span class="s ${s.free ? "free" : ""}" tabindex="0" data-tip="${esc(`${s.label}: ${money(s.usd)} · ${fmtPct(pct(s.usd, c.net))}`)}" style="flex:${s.usd / base} 1 0;${s.free ? "" : `background:${s.color}`}"></span>`).join("");
    const legend = segs.map((s) => `<li><span class="sw ${s.free ? "free" : ""}" style="${s.free ? "" : `background:${s.color}`}"></span><span>${esc(s.label)}</span><span class="v"><b>${esc(money(s.usd))}</b> · ${esc(fmtPct(pct(s.usd, c.net)))}</span></li>`).join("");
    return `<section class="card" aria-label="Cómo se reparte el mes">
      <div class="card-head"><h2>Cómo se reparte el mes</h2><span class="meta">% del ingreso neto</span></div>
      <div class="stack" role="img" aria-label="Reparto del ingreso neto por grupo">${bar}</div>
      <ul class="legend">${legend}</ul>
      ${c.left < 0 ? `<p class="foot" style="text-align:left;color:var(--danger)">Los gastos superan el ingreso neto por ${esc(money(-c.left))}.</p>` : ""}
    </section>`;
  }

  function paydays(c) {
    const tight = c.qs[0].left !== c.qs[1].left ? (c.qs[0].left < c.qs[1].left ? 1 : 2) : 0;
    return `<section class="paydays" aria-label="Por quincena">${c.qs.map((q) => {
      const used = Math.min(100, pct(q.out, q.income));
      return `<div class="payday ${tight === q.q ? "tight" : ""}">
        <span class="when">${q.q === 1 ? "1ª" : "2ª"} quincena</span>
        <span class="left ${q.left < 0 ? "neg" : ""}">${esc(money(q.left))}</span>
        <div class="bar" aria-hidden="true"><i class="${q.out > q.income ? "full" : ""}" style="width:${used}%"></i></div>
        <div class="rows"><span>Entra</span><span>${esc(money(q.income))}</span><span>Sale</span><span>${esc(money(q.out))}</span></div>
        ${tight === q.q ? `<span class="flag">La más justa</span>` : ""}
      </div>`;
    }).join("")}</section>`;
  }

  function lineRow(l, c, opts = {}) {
    const qTag = l.type === "Ingreso" || l.type === "Deducción" ? "" :
      l.q === 3 ? `<span class="q">Cada Q</span>` : l.q ? `<span class="q">${l.q === 1 ? "1ª Q" : "2ª Q"}</span>` : `<span class="q m">Mensual</span>`;
    const until = l.until ? `<span class="q end">${l.ended ? "Terminó" : "Hasta"} ${esc(monthLabel(l.until))}</span>` : "";
    const showOrig = l.cur === "%" || l.cur !== state.cur || l.q === 3;
    return `<button class="line" type="button" data-edit="${l.row}">
      <span class="name">${esc(l.name)}</span>
      <span class="amt ${opts.minus ? "minus" : ""}">${opts.minus ? "−" : ""}${esc(money(l.usd ?? toUsd(l.amount, l.cur, state.data.rate)))}</span>
      <span class="meta">${qTag}${until}${showOrig ? `<span class="orig">${esc(native(l))}${l.q === 3 && l.cur !== "%" ? " c/q" : ""}</span>` : ""}</span>
      <span class="share">${l.usd != null && !opts.noShare ? esc(fmtPct(pct(l.usd, c.net))) : ""}</span>
      ${l.notes ? `<span class="note">${esc(l.notes)}</span>` : ""}
    </button>`;
  }

  function income(c) {
    const rows = c.incomes.map((l) => lineRow(l, c, { noShare: true })).join("")
      + c.deductions.map((l) => lineRow(l, c, { minus: true, noShare: true })).join("");
    return `<section class="card" aria-label="Ingresos">
      <div class="group-head"><h2>Ingresos</h2><span class="tot num">${esc(money(c.net))}<small>neto al mes</small></span></div>
      <div class="lines">${rows || `<div class="line"><span class="name" style="color:var(--muted)">Agrega tu ingreso con “Agregar línea”.</span></div>`}
        ${Math.abs(c.qs[0].income - c.qs[1].income) < 0.5
          ? `<div class="line total"><span class="name">Neto por quincena</span><span class="amt">${esc(money(c.qs[0].income))}</span></div>`
          : c.qs.map((q) => `<div class="line total"><span class="name">Neto ${q.q === 1 ? "1ª" : "2ª"} quincena</span><span class="amt">${esc(money(q.income))}</span></div>`).join("")}
      </div>
    </section>`;
  }

  function groupCard(g, c) {
    const items = [...g.items].sort((a, b) => (a.q || 3) - (b.q || 3) || b.usd - a.usd);
    return `<section class="card" aria-label="${esc(g.g)}">
      <div class="group-head"><h2><span class="group-dot" style="background:${groupColor(g.g)}"></span>${esc(g.g)}</h2>
        <span class="tot">${esc(money(g.usd))}<small>${esc(fmtPct(pct(g.usd, c.net)))} del neto</small></span></div>
      <div class="lines">${items.map((l) => lineRow(l, c)).join("")}</div>
    </section>`;
  }

  function ended(c) {
    if (!c.ended.length) return "";
    return `<details class="ended"><summary>Ya terminaron (${c.ended.length}) · no cuentan en el total</summary>
      <div class="lines">${c.ended.map((l) => lineRow(l, c, { noShare: true })).join("")}</div></details>`;
  }

  // ---------- Edit sheet ----------
  function renderModal() {
    const host = $("#modal");
    if (state.rateEditing && state.data) { host.innerHTML = rateSheet(); return; }
    if (!state.editing || !state.data) { host.innerHTML = ""; return; }
    const isNew = state.editing === "new";
    const l = isNew ? { type: "Gasto", name: "", amount: "", cur: "USD", q: 1, groupRaw: "Casa", until: "", notes: "" }
      : state.data.lines.find((x) => x.row === state.editing);
    if (!l) { host.innerHTML = ""; return; }
    const [uy, um] = l.until ? l.until.split("-") : ["", ""];
    const year = new Date().getFullYear();
    const years = [year - 1, year, year + 1, year + 2, year + 3, year + 4];
    if (uy && !years.includes(+uy)) years.unshift(+uy);
    const radios = (name, opts, value) => `<div class="pick">${opts.map(([v, label]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${String(value) === String(v) ? "checked" : ""}><span>${esc(label)}</span></label>`).join("")}</div>`;
    host.innerHTML = `<div class="scrim" data-action="close">
      <form class="sheet" data-sheet="line" role="dialog" aria-modal="true" aria-label="${isNew ? "Nueva línea" : esc(l.name)}">
        <h2>${isNew ? "Nueva línea" : esc(l.name)}</h2>
        ${isNew ? "" : `<p class="hint">Fila ${l.row} de la pestaña ${TAB}</p>`}
        <div class="fld"><span>Tipo</span>${radios("type", TYPES, l.type)}</div>
        <label class="fld"><span>Concepto</span><input id="f-name" name="name" required value="${esc(l.name)}" autocomplete="off"></label>
        <div class="fld-row">
          <label class="fld"><span>Monto</span><input id="f-amount" name="amount" inputmode="decimal" required value="${esc(l.amount)}"></label>
          <label class="fld"><span>Moneda</span><select id="f-cur" name="cur">
            <option value="USD" ${l.cur === "USD" ? "selected" : ""}>$ Dólares</option>
            <option value="CRC" ${l.cur === "CRC" ? "selected" : ""}>₡ Colones</option>
            <option value="%" ${l.cur === "%" ? "selected" : ""}>% del ingreso</option>
          </select></label>
        </div>
        <div class="preview" id="f-preview"></div>
        <div class="fld"><span>Cuándo</span>${radios("q", [[1, "1ª quincena"], [2, "2ª quincena"], [3, "Cada quincena"], [0, "Una vez al mes"]], l.q)}</div>
        <label class="fld" data-only="gasto"><span>Grupo</span><select id="f-group" name="group">
          ${GROUPS.filter(([g]) => g !== "Ahorro").map(([g]) => `<option ${groupOf(l.groupRaw, l.type) === g ? "selected" : ""}>${g}</option>`).join("")}
        </select></label>
        <div class="fld"><span>Termina (opcional)</span><div class="fld-row">
          <select id="f-um" name="um" aria-label="Mes"><option value="">Sin fecha</option>${MONTHS.map((m, i) => `<option value="${String(i + 1).padStart(2, "0")}" ${um === String(i + 1).padStart(2, "0") ? "selected" : ""}>${m}</option>`).join("")}</select>
          <select id="f-uy" name="uy" aria-label="Año">${years.map((y) => `<option ${String(y) === (uy || String(year)) ? "selected" : ""}>${y}</option>`).join("")}</select>
        </div></div>
        <label class="fld"><span>Notas</span><textarea id="f-notes" name="notes">${esc(l.notes)}</textarea></label>
        ${state.saveError ? `<p class="error">${esc(state.saveError)}</p>` : ""}
        <div class="actions">
          ${isNew ? "" : `<button class="btn danger ${state.confirmDelete ? "sure" : ""}" type="button" data-action="delete" ${state.saving ? "disabled" : ""}>${state.confirmDelete ? "Sí, borrar" : "Borrar"}</button>`}
          <span class="spacer"></span>
          <button class="btn secondary" type="button" data-action="close">Cancelar</button>
          <button class="btn" type="submit" ${state.saving ? "disabled" : ""}>${state.saving ? "Guardando…" : "Guardar"}</button>
        </div>
      </form>
    </div>`;
    syncForm();
  }

  function rateSheet() {
    return `<div class="scrim" data-action="close">
      <form class="sheet" data-sheet="rate" role="dialog" aria-modal="true" aria-label="Tipo de cambio">
        <h2>Tipo de cambio</h2>
        <p class="hint">Convierte las líneas en colones a dólares y viceversa.</p>
        <label class="fld"><span>Colones por dólar</span><input id="f-rate" name="rate" inputmode="decimal" required value="${esc(state.data.rate)}"></label>
        ${state.saveError ? `<p class="error">${esc(state.saveError)}</p>` : ""}
        <div class="actions"><span class="spacer"></span>
          <button class="btn secondary" type="button" data-action="close">Cancelar</button>
          <button class="btn" type="submit" ${state.saving ? "disabled" : ""}>${state.saving ? "Guardando…" : "Guardar"}</button>
        </div>
      </form>
    </div>`;
  }

  // Shows only the fields that apply to the chosen type, and a live conversion.
  function syncForm() {
    const form = $('#modal form[data-sheet="line"]');
    if (!form) return;
    const type = (form.querySelector('input[name="type"]:checked') || {}).value || "Gasto";
    form.querySelectorAll('[data-only="gasto"]').forEach((el) => { el.hidden = type !== "Gasto"; });
    const pctOpt = form.querySelector('#f-cur option[value="%"]');
    pctOpt.disabled = type !== "Deducción";
    if (pctOpt.disabled && form.elements.cur.value === "%") form.elements.cur.value = "USD";
    form.elements.uy.disabled = !form.elements.um.value;
    const amount = parseAmount(form.elements.amount.value);
    const cur = form.elements.cur.value;
    const rate = state.data.rate;
    let text = "";
    if (amount && cur === "%") {
      const gross = compute(state.data).gross;
      text = `≈ <b>${esc(money((gross * amount) / 100, "USD"))}</b> · <b>${esc(money((gross * amount) / 100, "CRC"))}</b> al mes`;
    } else if (amount) {
      const usd = toUsd(amount, cur, rate);
      text = `≈ <b>${esc(money(usd, cur === "CRC" ? "USD" : "CRC"))}</b> al tipo de cambio de ₡${esc(rate.toLocaleString("en-US"))}`;
      if (form.elements.q.value === "3") text += ` · al mes <b>${esc(money(usd * 2, cur))}</b>`;
    }
    $("#f-preview").innerHTML = text;
  }

  function closeModal() { state.editing = null; state.rateEditing = false; state.confirmDelete = false; state.saveError = ""; renderModal(); }

  async function call(tool, args) { return state.mcp.callTool(SERVER, tool, { spreadsheetId: SHEET_ID, ...args }, { cache: false }); }
  async function refreshAfterWrite() { try { await state.mcp.invalidate(SERVER, "get_values"); } catch { /* the 3-minute refresh picks it up */ } }

  async function saveLine(form) {
    if (state.saving) return;
    const f = new FormData(form);
    const type = f.get("type") || "Gasto";
    const name = String(f.get("name") || "").trim();
    const amount = parseAmount(f.get("amount"));
    if (!name) { state.saveError = "Escribe el concepto."; renderModal(); return; }
    if (!amount) { state.saveError = "Escribe un monto mayor que cero."; renderModal(); return; }
    const q = Number(f.get("q") || 0);
    const group = type === "Gasto" ? String(f.get("group") || "Otros") : type === "Ahorro" ? "Ahorro" : "";
    // The apostrophe keeps Sheets from turning MM/YYYY into a date.
    const until = f.get("um") ? `'${f.get("um")}/${f.get("uy")}` : "";
    const cur = f.get("cur") || "USD";
    const rowValues = [type, name, amount, cur, q === 3 ? "Ambas" : q || "", group, until, String(f.get("notes") || "").trim()];
    state.saving = true; state.saveError = ""; renderModal();
    try {
      let row;
      if (state.editing === "new") {
        // Reuse the first empty row (a deleted line leaves one), else the next row after the last.
        const col = valuesOf(await call("get_values", { range: `${TAB}!A:B` }));
        row = col.length + 1;
        for (let i = 1; i < col.length; i++) if (!String((col[i] || [])[0] ?? "").trim() && !String((col[i] || [])[1] ?? "").trim()) { row = i + 1; break; }
      } else {
        const l = state.data.lines.find((x) => x.row === state.editing);
        const check = valuesOf(await call("get_values", { range: `${TAB}!A${l.row}:B${l.row}` }));
        const [t, n] = check[0] || [];
        if (normType(t) !== l.type || String(n ?? "").trim() !== l.name) throw new Error("La hoja cambió. Cierra, espera que se actualice e intenta de nuevo.");
        row = l.row;
      }
      await call("update_values", { range: `${TAB}!A${row}:H${row}`, values: [rowValues] });
      state.saving = false; state.editing = null; state.confirmDelete = false;
      renderModal();
      await refreshAfterWrite();
    } catch (e) {
      state.saving = false;
      state.saveError = (e && e.message && !e.code) ? e.message : "No se pudo guardar. Intenta de nuevo.";
      renderModal();
    }
  }

  async function deleteLine() {
    const l = state.data.lines.find((x) => x.row === state.editing);
    if (!l || state.saving) return;
    if (!state.confirmDelete) { state.confirmDelete = true; renderModal(); return; }
    state.saving = true; state.saveError = ""; renderModal();
    try {
      const check = valuesOf(await call("get_values", { range: `${TAB}!A${l.row}:B${l.row}` }));
      const [t, n] = check[0] || [];
      if (normType(t) !== l.type || String(n ?? "").trim() !== l.name) throw new Error("La hoja cambió. Cierra, espera que se actualice e intenta de nuevo.");
      await call("update_values", { range: `${TAB}!A${l.row}:H${l.row}`, values: [["", "", "", "", "", "", "", ""]] });
      state.data.lines = state.data.lines.filter((x) => x !== l);
      state.saving = false; closeModal(); render();
      await refreshAfterWrite();
    } catch (e) {
      state.saving = false; state.confirmDelete = false;
      state.saveError = (e && e.message && !e.code) ? e.message : "No se pudo borrar. Intenta de nuevo.";
      renderModal();
    }
  }

  async function saveRate(form) {
    if (state.saving) return;
    const rate = parseAmount(new FormData(form).get("rate"));
    if (!rate) { state.saveError = "Escribe un tipo de cambio válido."; renderModal(); return; }
    state.saving = true; state.saveError = ""; renderModal();
    try {
      const head = valuesOf(await call("get_values", { range: `${TAB}!J1` }));
      if (String((head[0] || [])[0] ?? "").trim() !== RATE_HEADER) throw new Error(`No encontré ${RATE_HEADER} en J1 de la pestaña ${TAB}.`);
      await call("update_values", { range: `${TAB}!J2`, values: [[rate]] });
      state.data.rate = rate;
      state.saving = false; closeModal(); render();
      await refreshAfterWrite();
    } catch (e) {
      state.saving = false;
      state.saveError = (e && e.message && !e.code) ? e.message : "No se pudo guardar. Intenta de nuevo.";
      renderModal();
    }
  }

  // ---------- Live data ----------
  let unwatch = null;
  function watchSheet(mcp) {
    if (unwatch) { try { unwatch(); } catch { /* already stopped */ } }
    unwatch = mcp.watchTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: RANGE }, (ev) => {
      if (ev.type === "data") {
        try { state.data = build(valuesOf(ev.result)); state.error = null; }
        catch (e) { state.error = e; state.data = null; }
      } else { state.error = ev.error; if (ev.error && ["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required"].includes(ev.error.code)) state.data = null; }
      if (!state.saving) render();
    }, { cache: { staleTime: 0, gcTime: 7 * 24 * 3600 * 1000 }, refetchInterval: 180000 });
  }
  // Only callTool can ask for consent; the watch picks the data up afterwards.
  async function connect() {
    if (!state.mcp) return;
    try {
      await state.mcp.callTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: `${TAB}!A1:A1` }, { cache: false });
      state.error = null; watchSheet(state.mcp);
    } catch (e) { state.error = e; render(); }
  }

  // ---------- Events ----------
  const tip = $("#tip");
  function showTip(el) {
    const r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const x = Math.min(window.innerWidth - 90, Math.max(90, r.left + r.width / 2));
    tip.style.left = x + "px"; tip.style.top = r.top + "px";
  }
  document.addEventListener("pointerover", (e) => { const s = e.target.closest("[data-tip]"); if (s) showTip(s); else tip.hidden = true; });
  document.addEventListener("focusin", (e) => { const s = e.target.closest("[data-tip]"); if (s) showTip(s); else tip.hidden = true; });
  document.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

  document.addEventListener("click", (e) => {
    const cur = e.target.closest("[data-cur]");
    if (cur) { state.cur = cur.dataset.cur; try { localStorage.setItem("presupuesto:cur", state.cur); } catch { /* storage unavailable */ } render(); return; }
    const s = e.target.closest("[data-tip]");
    if (s) { showTip(s); return; }
    const ed = e.target.closest("[data-edit]");
    if (ed && state.data) { state.editing = +ed.dataset.edit; state.saveError = ""; state.confirmDelete = false; renderModal(); return; }
    const close = e.target.closest('[data-action="close"]');
    if (close && (e.target === close || close.tagName === "BUTTON") && !state.saving) { closeModal(); return; }
    const act = e.target.closest("[data-action]");
    if (!act) return;
    const a = act.dataset.action;
    if (a === "new" && state.data) { state.editing = "new"; state.saveError = ""; renderModal(); }
    if (a === "rate" && state.data) { state.rateEditing = true; state.saveError = ""; renderModal(); }
    if (a === "delete") deleteLine();
    if (a === "connect") connect();
  });
  document.addEventListener("input", (e) => { if (e.target.closest('form[data-sheet="line"]')) syncForm(); });
  document.addEventListener("change", (e) => { if (e.target.closest('form[data-sheet="line"]')) syncForm(); });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.dataset.sheet === "rate") saveRate(e.target); else saveLine(e.target);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (state.editing || state.rateEditing) && !state.saving) closeModal(); });

  render();
  const use = window.claude && window.claude.use ? window.claude.use("mcp") : Promise.resolve(null);
  use.then((mcp) => { state.mcp = mcp; if (mcp) watchSheet(mcp); else render(); }).catch(() => { state.mcp = null; render(); });
})();
</script>

<title>Amex de Hannia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="css">
/* Layout: one phone-width column. Header with the card, a next-payment tile,
   period and status chips, then one group per Amex statement (newest first). Read only. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --fg: #111826;
  --muted: #5d6879;
  --line: #dbe1ea;
  --accent: #17824a;
  --accent-soft: #dff3e8;
  --on-accent: #ffffff;
  --ok: #17824a;
  --ok-soft: #dff3e8;
  --warn: #b5470f;
  --warn-soft: #fbe9df;
  --danger: #c2262e;
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #161c25; --surface-2: #1c2430; --fg: #e6ecf4; --muted: #8b97a9;
    --line: #283140; --accent: #4fc68c; --accent-soft: #133524; --on-accent: #06121f;
    --ok: #4fc68c; --ok-soft: #133524; --warn: #ff9a66; --warn-soft: #3a2116; --danger: #ff6b72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161c25; --surface-2: #1c2430; --fg: #e6ecf4; --muted: #8b97a9;
  --line: #283140; --accent: #4fc68c; --accent-soft: #133524; --on-accent: #06121f;
  --ok: #4fc68c; --ok-soft: #133524; --warn: #ff9a66; --warn-soft: #3a2116; --danger: #ff6b72;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.app { max-width: 720px; margin: 0 auto; padding-bottom: 32px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; }
.card-art {
  flex: none; width: 52px; height: 34px; border-radius: 6px; position: relative;
  background: linear-gradient(135deg, var(--ok), var(--accent-soft));
  border: 1px solid var(--line);
}
.card-art::after { content: ""; position: absolute; left: 7px; top: 11px; width: 11px; height: 9px; border-radius: 2px; background: var(--surface); opacity: 0.75; }
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.who .sub { font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; gap: 6px; padding: 2px; margin-inline: -2px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; }
.chips + .chips { margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-block: 16px 4px; }
@media (max-width: 380px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.tile .when { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; line-height: 1.15; }
.tile .when.soon { color: var(--warn); }
.tile .when.late { color: var(--danger); }
.tile .value { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
.tile .sub { font-size: 0.76rem; color: var(--muted); }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; overflow: hidden; }
.group-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.group-head .name { flex: 1; min-width: 0; font-weight: 700; font-size: 0.92rem; }
.group-head .name small { display: block; font-weight: 500; color: var(--muted); font-size: 0.78rem; }
.group-head .totals { text-align: right; font-size: 0.85rem; font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
.group-head .totals .ok { color: var(--ok); }
.group-head .totals .pend { color: var(--warn); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .merchant { font-weight: 600; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amount { font-size: 0.95rem; font-weight: 600; text-align: right; }
.row .meta { font-size: 0.78rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.row .side { display: flex; justify-content: flex-end; align-items: center; }
.pill { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap; }
.pill.pending { background: var(--warn-soft); color: var(--warn); }
.pill.paid { background: var(--ok-soft); color: var(--ok); }

.empty, .notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px 18px; margin-top: 16px; text-align: center; color: var(--muted); }
.notice { border-style: solid; text-align: left; color: var(--fg); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.notice h3 { margin: 0; font-size: 1rem; }
.notice p { margin: 0; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); color: var(--fg); border-color: var(--line); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.foot { font-size: 0.76rem; color: var(--muted); margin-top: 18px; text-align: center; }
</style>
<div id="app" class="app"></div>
<script type="application/json" id="snapshot">null</script>
<script id="code">
(() => {
  "use strict";

  // ---------- Config (the only part that differs between the two pages) ----------
  const VIEWER = { name: "Hannia", last: "7311", holder: "HANNIA" };

  const SERVER = "Google Sheets";
  const SHEET_ID = "1jLcS4xf7jNM6OE2nGU5aHX3JThDyL4ud5gVqhvZ13ss";
  const TXN_RANGE = "Transactions!A:P";
  const PAY_RANGE = "Payments!A:F";
  // Amex statement: closes on the 27th, due on the 12th of the next month (same defaults as the main app).
  const CUTOFF = 27, PAY = 12;
  // The exact wrapper the Artifact tool puts around this file. The page republishes itself in this shape.
  const SKELETON_OPEN = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
  const SKELETON_CLOSE = "\n</body></html>";

  const snapshot = readSnapshot();
  const PERIODS = [["next", "Próximo pago"], ["following", "Siguiente estado"], ["previous", "Estado anterior"], ["all", "Todo"]];
  const savedPeriod = (() => { try { return localStorage.getItem("amex:period"); } catch { return null; } })();
  const state = { period: PERIODS.some(([id]) => id === savedPeriod) ? savedPeriod : "next", filter: "all", live: null, mcp: undefined, liveError: null, canPublish: true, publishing: false, publishError: "" };

  // ---------- Helpers ----------
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function readSnapshot() {
    try { const s = JSON.parse(document.getElementById("snapshot").textContent); return s && Array.isArray(s.txns) ? s : null; }
    catch { return null; }
  }
  function parseAmount(raw) {
    if (typeof raw === "number") return raw;
    let t = String(raw ?? "").trim();
    if (!t) return 0;
    const neg = /^\(.*\)$/.test(t) || t.startsWith("-");
    t = t.replace(/[^\d.,]/g, "");
    if (t.includes(",") && t.includes(".")) {
      t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
    } else if (t.includes(",")) {
      t = /,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, "");
    }
    const n = parseFloat(t);
    return isNaN(n) ? 0 : (neg ? -n : n);
  }
  function parseDate(raw) {
    const t = String(raw ?? "").trim();
    let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return iso(+m[1], +m[2], +m[3]);
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return iso(+m[3], +m[1], +m[2]);
    return "";
  }
  function iso(y, mo, d) { return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  function todayIso() { const d = new Date(); return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  function addDays(isoDate, n) { const [y, m, d] = isoDate.split("-").map(Number); const dt = new Date(y, m - 1, d + n); return iso(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  function fmtDate(isoDate, withYear) {
    if (!isoDate) return "—";
    const [y, m, d] = isoDate.split("-").map(Number);
    return `${d} ${MONTHS[m - 1]}${withYear ? " " + y : ""}`;
  }
  function fmtStamp(ms) {
    const d = new Date(ms);
    if (isNaN(d)) return "";
    return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  const SYMBOL = { CRC: "₡", USD: "$" };
  function money(amount, currency) {
    const sym = SYMBOL[currency] ?? (currency ? currency + " " : "");
    const n = Math.abs(amount).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (amount < 0 ? "−" : "") + sym + n;
  }
  function totalsText(list) {
    const out = {};
    for (const t of list) out[t.currency] = (out[t.currency] || 0) + t.amount;
    const keys = Object.keys(out).sort((a, b) => (a === "CRC" ? -1 : b === "CRC" ? 1 : a.localeCompare(b)));
    return keys.length ? keys.map((c) => money(out[c], c)).join(" · ") : money(0, "CRC");
  }

  // ---------- Statements ----------
  function cutoffFor(y, m) { const last = new Date(y, m, 0).getDate(); return iso(y, m, Math.min(CUTOFF, last)); }
  function payFor(y, m) { const last = new Date(y, m, 0).getDate(); return iso(y, m, Math.min(PAY, last)); }
  function shiftMonth(y, m, delta) { const idx = y * 12 + (m - 1) + delta; return [Math.floor(idx / 12), (idx % 12) + 1]; }
  // The statement that closes in month (y, m).
  function statementClosing(y, m) {
    return { key: iso(y, m, 1), start: addDays(cutoffFor(...shiftMonth(y, m, -1)), 1), end: cutoffFor(y, m), due: payFor(...shiftMonth(y, m, PAY <= CUTOFF ? 1 : 0)) };
  }
  function statementOf(date) {
    const [y, m, d] = date.split("-").map(Number);
    return d <= Math.min(CUTOFF, new Date(y, m, 0).getDate()) ? statementClosing(y, m) : statementClosing(...shiftMonth(y, m, 1));
  }
  // The next payment coming up: the earliest statement whose due date is today or later.
  function nextStatement() {
    const [y, m] = todayIso().split("-").map(Number);
    for (let k = -2; k <= 1; k++) { const st = statementClosing(...shiftMonth(y, m, k)); if (st.due >= todayIso()) return st; }
    return statementClosing(y, m);
  }
  // The statement the period chips point at; null for "Todo".
  function selectedStatement() {
    if (state.period === "all") return null;
    const next = nextStatement();
    const [y, m] = next.key.split("-").map(Number);
    if (state.period === "following") return statementClosing(...shiftMonth(y, m, 1));
    if (state.period === "previous") return statementClosing(...shiftMonth(y, m, -1));
    return next;
  }
  function daysUntil(isoDate) {
    const [y, m, d] = isoDate.split("-").map(Number);
    const [ty, tm, td] = todayIso().split("-").map(Number);
    return Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
  }
  function whenText(isoDate) {
    const n = daysUntil(isoDate);
    if (n === 0) return "hoy";
    if (n === 1) return "mañana";
    if (n > 1) return `en ${n} días`;
    return n === -1 ? "ayer" : `hace ${-n} días`;
  }

  // ---------- Sheet → this card's movements ----------
  function valuesOf(result) {
    const p = result && (result.payload ?? result);
    if (p && Array.isArray(p.values)) return p.values;
    if (p && typeof p === "object" && !Array.isArray(p)) return [];
    throw new Error("Respuesta inesperada de Google Sheets.");
  }
  // Matches by last digits and cardholder: some of this card's emails arrive labelled MASTER.
  function belongs(last, holder) {
    return String(last).trim() === VIEWER.last && String(holder).toUpperCase().includes(VIEWER.holder);
  }
  function buildMovements(txnValues, payValues) {
    if (!txnValues.length) return [];
    const header = txnValues[0].map((h) => String(h).trim());
    const col = (n) => header.indexOf(n);
    const idx = { ref: col("Reference"), date: col("TxnDate"), merchant: col("Merchant"), location: col("Location"), currency: col("Currency"), amount: col("Amount"), last: col("LastDigits"), holder: col("CardholderName"), pid: col("PaymentID") };
    if (Object.values(idx).some((i) => i < 0)) throw new Error("La pestaña Transactions no tiene las columnas esperadas.");
    const payDates = new Map();
    payValues.slice(1).forEach((r) => { const id = String(r[0] ?? "").trim(); if (id) payDates.set(id, parseDate(r[1])); });
    const out = [];
    txnValues.slice(1).forEach((r) => {
      const ref = String(r[idx.ref] ?? "").trim();
      if (!ref || !belongs(r[idx.last], r[idx.holder])) return;
      const pid = String(r[idx.pid] ?? "").trim();
      out.push({
        ref,
        date: parseDate(r[idx.date]),
        merchant: String(r[idx.merchant] ?? "").trim() || "(sin comercio)",
        location: String(r[idx.location] ?? "").trim().replace(/^,\s*/, ""),
        currency: String(r[idx.currency] ?? "").trim() || "CRC",
        amount: parseAmount(r[idx.amount]),
        paid: !!pid,
        payDate: pid ? (payDates.get(pid) || "") : "",
      });
    });
    out.sort((a, b) => (b.date || "").localeCompare(a.date || "") || a.ref.localeCompare(b.ref));
    return out;
  }
  const CONSENT = ["approval_required", "not_in_manifest", "consent_required"];
  const sameMovements = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // ---------- Rendering ----------
  function current() { return state.live ?? (snapshot ? snapshot.txns : null); }

  function render() {
    const txns = current();
    const app = $("#app");
    const updated = state.live ? "En vivo desde la hoja" : snapshot ? `Actualizado el ${fmtStamp(snapshot.updatedAt)}` : "";
    let html = `
      <header class="top"><div class="gutter">
        <div class="top-row">
          <div class="card-art" aria-hidden="true"></div>
          <div class="who"><h1>Amex de ${esc(VIEWER.name)}</h1><div class="sub">Tarjeta terminada en <span class="num">${esc(VIEWER.last)}</span>${updated ? " · " + esc(updated) : ""}</div></div>
        </div>
        <div class="chips" role="group" aria-label="Estado de cuenta">
          ${PERIODS.map(([id, label]) => `<button class="chip" type="button" data-period="${id}" aria-pressed="${state.period === id}">${label}</button>`).join("")}
        </div>
        <div class="chips" role="group" aria-label="Filtrar por pago">
          ${[["all", "Todos"], ["pending", "Pendientes"], ["paid", "Pagados"]].map(([id, label]) => `<button class="chip" type="button" data-filter="${id}" aria-pressed="${state.filter === id}">${label}</button>`).join("")}
        </div>
      </div></header>
      <main class="gutter">`;
    html += publishNotice(txns);
    if (!txns) {
      html += `<div class="empty">Todavía no hay movimientos publicados para esta tarjeta.</div>`;
    } else {
      html += summary(txns) + groups(txns);
    }
    html += `<p class="foot">Solo lectura. Los pagos los registra Esteban.</p>`;
    if (state.liveError && CONSENT.includes(state.liveError.code)) {
      html += `<p class="foot"><button class="btn secondary" type="button" data-action="connect">Conectar con la hoja (administrador)</button></p>`;
    }
    html += `</main>`;
    app.innerHTML = html;
  }

  function summary(txns) {
    const st = nextStatement();
    const inNext = txns.filter((t) => t.date >= st.start && t.date <= st.end);
    const pendNext = inNext.filter((t) => !t.paid);
    const pendAll = txns.filter((t) => !t.paid);
    const n = daysUntil(st.due);
    const cls = n < 0 ? "late" : n <= 5 ? "soon" : "";
    return `<section class="summary">
      <div class="tile">
        <span class="label">Próximo pago</span>
        <span class="when ${cls}">${esc(fmtDate(st.due))} · ${esc(whenText(st.due))}</span>
        <span class="value num">${esc(totalsText(pendNext))}</span>
        <span class="sub">Pendiente del estado ${esc(fmtDate(st.start))} – ${esc(fmtDate(st.end))}</span>
      </div>
      <div class="tile">
        <span class="label">Todo lo pendiente</span>
        <span class="when">${pendAll.length} movimiento${pendAll.length === 1 ? "" : "s"}</span>
        <span class="value num">${esc(totalsText(pendAll))}</span>
        <span class="sub">${txns.length - pendAll.length} pagado${txns.length - pendAll.length === 1 ? "" : "s"} de ${txns.length}</span>
      </div>
    </section>`;
  }

  function groups(txns) {
    const sel = selectedStatement();
    const shown = txns.filter((t) => (state.filter === "all" || (state.filter === "paid") === t.paid) && (!sel || (t.date >= sel.start && t.date <= sel.end)));
    if (!shown.length) {
      const where = sel ? ` en el estado del ${fmtDate(sel.start)} al ${fmtDate(sel.end, true)}` : "";
      const what = state.filter === "pending" ? "No hay nada pendiente" : state.filter === "paid" ? "No hay nada pagado" : "No hay movimientos";
      return `<div class="empty">${esc(what + where)}.</div>`;
    }
    const byStatement = new Map();
    for (const t of shown) {
      const st = t.date ? statementOf(t.date) : { key: "", start: "", end: "", due: "" };
      if (!byStatement.has(st.key)) byStatement.set(st.key, { st, items: [] });
      byStatement.get(st.key).items.push(t);
    }
    return [...byStatement.values()].sort((a, b) => b.st.key.localeCompare(a.st.key)).map(({ st, items }) => {
      const pend = items.filter((t) => !t.paid), paid = items.filter((t) => t.paid);
      const title = st.key ? `Estado del ${fmtDate(st.start)} al ${fmtDate(st.end, true)}` : "Sin fecha";
      return `<section class="group">
        <div class="group-head">
          <div class="name">${esc(title)}<small>${st.due ? "Se paga el " + esc(fmtDate(st.due, true)) : ""}</small></div>
          <div class="totals num">
            ${pend.length ? `<span class="pend">${esc(totalsText(pend))} pendiente</span>` : ""}
            ${paid.length ? `<span class="ok">${esc(totalsText(paid))} pagado</span>` : ""}
          </div>
        </div>
        <div class="rows">${items.map(row).join("")}</div>
      </section>`;
    }).join("");
  }

  function row(t) {
    const status = t.paid
      ? `<span class="pill paid">Pagado${t.payDate ? " · " + esc(fmtDate(t.payDate)) : ""}</span>`
      : `<span class="pill pending">Pendiente</span>`;
    return `<div class="row">
      <div class="merchant">${esc(t.merchant)}</div>
      <div class="amount num">${esc(money(t.amount, t.currency))}</div>
      <div class="meta">${esc(fmtDate(t.date, true))}${t.location ? " · " + esc(t.location) : ""}</div>
      <div class="side">${status}</div>
    </div>`;
  }

  // Shown only to someone whose own Google Sheets connector can read the sheet (Esteban).
  function publishNotice(txns) {
    if (!state.live || !state.canPublish) {
      if (state.publishError) return `<div class="notice"><p>${esc(state.publishError)}</p></div>`;
      return "";
    }
    if (snapshot && sameMovements(state.live, snapshot.txns)) return "";
    return `<div class="notice">
      <h3>${snapshot ? "Hay cambios que " + esc(VIEWER.name) + " aún no ve" : "Esta página está vacía para " + esc(VIEWER.name)}</h3>
      <p>Lo que ves sale de tu hoja. ${esc(VIEWER.name)} solo ve la última versión publicada, sin acceso a la hoja.</p>
      <button class="btn" type="button" data-action="publish" ${state.publishing ? "disabled" : ""}>${state.publishing ? "Publicando…" : "Publicar para " + esc(VIEWER.name)}</button>
      ${state.publishError ? `<p>${esc(state.publishError)}</p>` : ""}
    </div>`;
  }

  // ---------- Live data and publishing ----------
  let unwatch = [];
  function watchSheet(mcp) {
    unwatch.forEach((u) => { try { u(); } catch { /* already stopped */ } }); unwatch = [];
    let txnValues = null, payValues = null;
    const opts = { cache: { staleTime: 0, gcTime: 7 * 24 * 3600 * 1000 }, refetchInterval: 180000 };
    const update = () => {
      if (!txnValues || !payValues) return;
      try { state.live = buildMovements(txnValues, payValues); state.liveError = null; }
      catch (e) { state.liveError = e; }
      render();
    };
    // Errors here usually mean this viewer has no access to the sheet: keep showing the published copy.
    unwatch.push(mcp.watchTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: TXN_RANGE }, (ev) => {
      if (ev.type === "data") { try { txnValues = valuesOf(ev.result); } catch (e) { state.liveError = e; } update(); }
      else { state.liveError = ev.error; state.live = null; render(); }
    }, opts));
    unwatch.push(mcp.watchTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: PAY_RANGE }, (ev) => {
      if (ev.type === "data") { try { payValues = valuesOf(ev.result); } catch { payValues = [[]]; } }
      else payValues = payValues || [[]];
      update();
    }, opts));
  }

  function documentFor(txns) {
    const data = JSON.stringify({ updatedAt: Date.now(), txns }).replace(/</g, "\\u003c");
    const head = [...document.querySelectorAll('meta[name="claude:viewport-fit-sides"], link[rel="preconnect"], link[rel="stylesheet"]')]
      .map((el) => el.outerHTML).join("\n");
    return SKELETON_OPEN
      + `<title>${esc(document.title)}</title>\n${head}\n`
      + `<style id="css">${$("#css").textContent}</style>\n`
      + `<div id="app" class="app"></div>\n`
      + `<script type="application/json" id="snapshot">${data}<\/script>\n`
      + `<script id="code">${$("#code").textContent}<\/script>\n`
      + SKELETON_CLOSE;
  }

  async function publish() {
    if (!state.live || state.publishing) return;
    state.publishing = true; state.publishError = ""; render();
    try {
      const artifact = await window.claude.use("artifact");
      if (!artifact) throw { code: "not_granted" };
      await artifact.publish(documentFor(state.live));
      // The view reloads to the new version on its own.
    } catch (e) {
      const code = e && e.code;
      state.publishing = false;
      if (code === "conflict") return;
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required") {
        state.canPublish = false;
        state.publishError = "Esta vista es de solo lectura, así que no puede publicar cambios.";
      } else if (code === "rate_limited") {
        state.publishError = "Demasiadas publicaciones seguidas. Intenta en un minuto.";
      } else {
        state.publishError = "No se pudo publicar. Intenta de nuevo en unos segundos.";
      }
      render();
    }
  }

  // Only callTool can ask for consent; the watches pick the data up afterwards.
  async function connect() {
    if (!state.mcp) return;
    try {
      await state.mcp.callTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: "Transactions!A1:A1" }, { cache: false });
      state.liveError = null; watchSheet(state.mcp);
    } catch (e) { state.liveError = e; render(); }
  }

  document.addEventListener("click", (e) => {
    const f = e.target.closest("[data-filter]");
    if (f) { state.filter = f.dataset.filter; render(); return; }
    const pr = e.target.closest("[data-period]");
    if (pr) { state.period = pr.dataset.period; try { localStorage.setItem("amex:period", state.period); } catch { /* storage unavailable */ } render(); return; }
    if (e.target.closest('[data-action="publish"]')) publish();
    if (e.target.closest('[data-action="connect"]')) connect();
  });

  render();
  const use = window.claude && window.claude.use ? window.claude.use("mcp") : Promise.resolve(null);
  use.then((mcp) => { state.mcp = mcp; if (mcp) watchSheet(mcp); }).catch(() => { state.mcp = null; });
})();
</script>
